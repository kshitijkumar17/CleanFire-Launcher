name: Build

on:
  push:
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK components
        run: sdkmanager 'platforms;android-30' 'build-tools;35.0.0'
      - name: Build and inspect debug APK
        run: |
          bash -n build.sh install-fireos.sh uninstall-fireos.sh
          ./build.sh --debug
          test -s build/material-home-fireos.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/material-home-fireos.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build/material-home-fireos.apk | grep "package: name='dev.karat.materialhome'"
          unzip -l build/material-home-fireos.apk | grep 'cleanfire_icon.png'
          unzip -l build/material-home-fireos.apk | grep 'cleanfire_banner.png'
          mkdir -p build/host-test
          javac --release 17 -d build/host-test src/com/rampey/materialtv/WeatherPolicy.java tools/WeatherPolicyTest.java
          java -cp build/host-test com.rampey.materialtv.WeatherPolicyTest

# This job never signs or publishes a production APK. Release signing stays on
# the maintainer's machine unless a separate reviewed secret-backed workflow is added.
